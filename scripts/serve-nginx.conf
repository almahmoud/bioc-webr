# Local preview of a built repository. Rendered by the nginx image's
# envsubst entrypoint, which is why ${BIOC_VERSION} appears literally here.
#
#   docker compose --profile serve up serve
#   -> http://localhost:8080/
#
# Not a production config. It exists so a built tree can be pointed at from a
# webR session, which fetches over HTTP and cannot read file:// URLs.
server {
    listen 80;
    server_name _;
    root /repo/${BIOC_VERSION}/_site;

    # webR fetches packages with plain GETs, but a page loading webR from
    # another origin needs CORS to read from this one.
    add_header Access-Control-Allow-Origin  "*"                   always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS"   always;

    # During development the same paths are rebuilt repeatedly, so caching
    # would serve stale packages.
    add_header Cache-Control "no-store" always;

    # Directory listings, for browsing the tree while checking a build. The
    # generated index.html takes precedence where it exists.
    autoindex on;
    autoindex_exact_size off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo page, served next to the repository so it can be pointed at a
    # local build rather than the published one:
    #
    #   http://localhost:8080/demo/?repo=http://localhost:8080/
    #
    # The ?repo= override is honoured only on localhost - see demo/index.html.
    location /demo/ {
        alias /demo/;
        index index.html;
        autoindex off;
    }

    types {
        application/octet-stream tgz;
        application/wasm         wasm;
        application/javascript   js;
        text/html                html;
        text/plain               txt;
    }
    default_type application/octet-stream;
}
