apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-webr-storage.yaml
  - 20-webr.yaml
  - 30-webr-ingress.yaml
  - 40-webr-repl.yaml

configMapGenerator:
  - name: webr-repl-files
    namespace: webr-repl
    files:
      - repl-files/index.html
      - repl-files/repl.mjs
  - name: nginx-conf
    namespace: webr-repl
    files:
      - repl-files/nginx.conf

generatorOptions:
  disableNameSuffixHash: true
