apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webr-pvc
  namespace: webr
spec:
  accessModes:
    - ReadWriteOnce
  # Site-specific: storage class and size. The volume holds every served
  # release plus a temporary copy of the release being refreshed.
  storageClassName: nfs-client
  resources:
    requests:
      storage: 250Gi
