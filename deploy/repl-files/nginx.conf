events {}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Only define missing MIME types
  types {
    text/javascript mjs;
  }

  server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self' https://webr.r-wasm.org; worker-src 'self' blob:;";
    add_header X-Content-Type-Options nosniff;

    # Fixed try_files directive
    location / {
      try_files $uri $uri/ /index.html$is_args$args;
    }
  }
}
