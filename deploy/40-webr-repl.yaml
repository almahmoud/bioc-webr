apiVersion: apps/v1
kind: Deployment
metadata:
  name: webr-repl
  namespace: webr-repl
  labels:
    app: webr-repl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: webr-repl
  template:
    metadata:
      labels:
        app: webr-repl
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webr-files
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: webr-files
          configMap:
            name: webr-repl-files
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: webr-repl-service
  namespace: webr-repl
spec:
  selector:
    app: webr-repl
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: webr-repl
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webr-repl
  namespace: webr-repl
  annotations:
    # Site-specific: the cert-manager ClusterIssuer.
    cert-manager.io/cluster-issuer: ssl-wildcard
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - run.webr.bioconductor.org
      secretName: run-webr-bioconductor-org-tls
  rules:
    - host: run.webr.bioconductor.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webr-repl-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webr-repl-http-redirect
  namespace: webr-repl
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: webr-repl-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: run.webr.bioconductor.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webr-repl-service
                port:
                  number: 80
